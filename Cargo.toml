[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
texelscope-capture = { path = "crates/texelscope-capture" }
texelscope-explain = { path = "crates/texelscope-explain" }
texelscope-interp = { path = "crates/texelscope-interp" }
texelscope-ir = { path = "crates/texelscope-ir" }
texelscope-rewrite = { path = "crates/texelscope-rewrite" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
naga = "30"
png = "0.18"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
